<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://kit.fontawesome.com/a8156b8a54.js"
      crossorigin="anonymous"
    ></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="lesson-five.css" />
    <title>Lesson Five - JavaScript</title>
  </head>
  <body>
    <!--Navbar-->
    <header>
      <nav class="navbar">
        <div>
          <p class="navbar-home">
            <a href="/index.html" class="link">JavaScript Assignments</a>
          </p>
        </div>
        <div>
          <ul class="navbar-links">
            <li class="navbar-link">
              <a href="/src/lesson-one/lesson-one.html" class="link">One</a>
            </li>
            <li class="navbar-link">
              <a href="/src/lesson-two/lesson-two.html" class="link">Two</a>
            </li>
            <li class="navbar-link">
              <a href="/src/lesson-three/lesson-three.html" class="link"
                >Three</a
              >
            </li>
            <li class="navbar-link">
              <a href="/src/lesson-four/lesson-four.html" class="link">Four</a>
            </li>
            <li class="navbar-link">
              <a href="/src/lesson-five/lesson-five.html" class="link">Five</a>
            </li>
          </ul>
        </div>
      </nav>
    </header>
    <!--Bank Account-->
    <main>
      <div class="bank-account-container">
        <!--Signal - Wifi - Battery-->
        <div class="phone-icons">
          <i class="fa-solid fa-signal"></i>
          <i class="fa-solid fa-wifi"></i>
          <i class="fa-solid fa-battery-full"></i>
        </div>

        <!--Logged out message-->
        <p class="hidden" id="logged-out-msg"></p>

        <!--Account header-->
        <div class="account-header" id="account-header">
          <h1 class="account-name" id="account-name">
            Account Name <i class="fa-solid fa-arrow-right-long"></i>
          </h1>
          <div class="account-image">
            <button onclick="atm('account name')">
              <img src="images/Caractacus.webp" alt="An image of Caractacus" />
            </button>
          </div>
        </div>

        <!--Account balance-->
        <div class="account-balance" id="account-balance">
          <p class="balance-title">Account Balance</p>
          <button id="toggle-btn" onclick="atm('balance')">Show Balance</button>
          <h3 class="balance-sum" id="balance"></h3>
        </div>

        <!--Account actions-->
        <div class="account-actions" id="account-actions">
          <!--Deposit-->
          <button onclick="atm('deposit')" class="action-card deposit">
            <i class="fa-solid fa-piggy-bank"></i>
            <p>Deposit</p>
          </button>
          <!--Withdraw-->
          <button onclick="atm('withdraw')" class="action-card withdraw">
            <i class="fa-solid fa-money-bill-1-wave"></i>
            <p>Withdraw</p>
          </button>
          <!--Account Info-->
          <button
            onclick="handleAlert('Account Information')"
            class="action-card account-info"
          >
            <i class="fa-solid fa-user-gear"></i>
            <p>Account Info</p>
          </button>
        </div>
        <hr id="horizontal-rule" />

        <!--Account status-->
        <div class="account-status" id="account-status">
          <button onclick="atm('exit')" class="btn-log-out">
            <i class="fa-solid fa-power-off"></i> Log Out
          </button>
          <button class="btn-exit">
            <i class="fa-solid fa-circle-xmark"></i> Exit
          </button>
        </div>

        <!--Bottom Navbar-->
        <div class="bottom-account-nav">
          <div class="bottom-account-nav-btns">
            <button onclick="handleAlert('Home')" class="btn-home">
              <i class="fa-solid fa-house"></i> Home
            </button>
            <button onclick="handleAlert('More Options')" class="btn-add">
              <i class="fa-solid fa-circle-plus"></i>
            </button>
            <button onclick="handleAlert('Settings')" class="btn-settings">
              <i class="fa-solid fa-gear"></i> Settings
            </button>
          </div>
          <hr />
        </div>
      </div>
    </main>
    <script src="lesson-five.js"></script>
  </body>
</html>
